[build-system]
    build-backend = "setuptools.build_meta"
    requires      = ["setuptools-scm[toml]>=6.2", "setuptools>=64", "wheel"]

[project]
    dynamic         = ["version"]
    name            = "ocr"
    requires-python = ">= 3.13"
    # Shared deps used by the hazard-agnostic modules (ocr/*.py). Hazard-specific deps go in extras.
    dependencies = [
        "duckdb>=2.0.0,<3",
        "fsspec>=2026.9.0",
        "geoparquet-lod @ git+https://github.com/Shane98c/geoparquet-lod.git@5f4556a6d581ad850f247893652484fb713f7dfe",
        "icechunk>=2.3.0,<3",
        "obstore>=0.12.0,<0.13",
        "odc-geo>=0.5.3,<0.6",
        # TODO: swap pyarrow for arro3-core/arro3-io if dask is removed (and some fire deps are refactored).
        "pyarrow>=26.0.0",
        "pydantic-extra-types>=2.11.1,<3",
        "pydantic-settings>=2.16.1,<3",
        "semver>=3.1.0,<4", # required by pydantic_extra_types.semantic_version
        "s3fs>=2026.9.0",
        "topozarr>=0.2.1,<0.3",
        "universal-pathlib>=0.3.10,<0.4",
        "xarray>=2026.9.0",
        "xproj>=0.2.1,<0.3",
        "zarr>=3.4.2,<4",
    ]

# Published extras; pixi turns each into a feature of the same name.
[project.optional-dependencies]
    fire = [
        "bottleneck>=1.6.0,<2",
        "cartopy>=0.26.0,<0.27",
        "dask>=2026.8.0",
        "flox>=0.11.2,<0.12",
        "geopandas>=1.2.0,<2",
        "matplotlib>=3.11.0,<4",
        "morecantile>=7.1.0,<8",
        "opencv-python-headless>=5.0.0,<6",
        "pint-xarray>=0.6.1,<0.7",
        "pooch>=1.9.0,<2",
        "pydantic>=2.14.1,<3",
        "pyproj>=3.8.0,<4",
        "python-dotenv>=1.2.0,<2",
        "rasterio>=1.5.2,<2",
        "rich>=15.0.0",
        "rioxarray>=0.23.0,<0.24",
        "tqdm>=4.70.1,<5",
        "typer>=0.27.3,<0.28",
        "xclim>=0.62.0,<0.63",
    ]
    flood         = ["dask>=2026.8.0", "rasterio>=1.5.2,<2", "rioxarray>=0.23.0,<0.24", "typer>=0.27.3,<0.28"]
    coiled-deploy = ["coiled>=1.135.6,<2", "jupyter-server-proxy>=4.6.0,<5", "jupyterlab>=4.6.4,<5"]
    data-mgmt = [
        "boto3>=1.40.0,<2", # aiobotocore (via s3fs) pins botocore
        "netcdf4>=1.7.5,<2",
        "patool>=4.1.0,<5",
    ]

# PEP 735 groups: not published; pixi turns each into a feature of the same name.
[dependency-groups]
    dev = ["prek>=0.5.7,<0.6", "pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "ruff>=0.17.3,<0.18", "syrupy>=6.1.1,<7"]
    docs = [
        "myst-nb>=1.4.0,<2",
        "sphinx-autobuild>=2025.8.25",
        "sphinx-book-theme>=1.4.0,<2",
        "sphinx-click>=6.2.0,<7",
        "sphinx-copybutton>=0.5.2,<0.6",
        "sphinx-design>=0.7.0,<0.8",
        "sphinxcontrib-mermaid>=2.1.1,<3",
        "sphinxext-opengraph>=0.13.0,<0.14",
    ]

[project.scripts]
    ocr        = "ocr.cli:app"
    ocr-deploy = "ocr.risks.fire.deploy.cli:app"

[tool.setuptools.packages.find]
    include = ["ocr*"]
    where   = ["src"]

[tool.setuptools.package-data]
    "ocr.risks.fire" = ["data/*.json"]

[tool.setuptools_scm]
    fallback_version = "999"
    local_scheme     = "node-and-date"
    version_scheme   = "post-release"

[tool.coverage.run]
    branch = true
    omit   = ["tests/*"]

[tool.ruff]
    extend-include = ["*.ipynb"]
    line-length    = 100

[tool.ruff.lint]
    ignore = [
        "E501", # Conflicts with ruff format
        "E721", # Comparing types instead of isinstance
        "E741", # Ambiguous variable names
    ]
    select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
    combine-as-imports = true

[tool.ruff.format]
    docstring-code-format = true
    quote-style           = "single"

[tool.pytest.ini_options]
    addopts = [
        "--cov-report=term-missing",
        "--cov-report=xml",
        "--cov=./src/ocr",
        "--verbose",
        "--ignore=tests/fire",  # legacy fire tests; skipped during the multi-hazard refactor
    ]
    console_output_style = "count"
    markers = [
        "integration: marks tests that require external resources or complex setups",
        "unit: marks tests that are fast and isolated from external systems",
    ]

[tool.uv.sources]
    ocr = { workspace = true }

[tool.pixi.workspace]
    channels  = ["conda-forge"]
    name      = "ocr"
    # rasterio macOS wheels target 15.0; lower makes pixi build it from sdist against system GDAL.
    platforms = ["linux-64", "linux-aarch64", { name = "osx-arm64-15", platform = "osx-arm64", macos = "15.0" }]

# Wheels only: building these from source would link against system GDAL/PROJ/HDF5.
[tool.pixi.pypi-options]
    no-build = ["cartopy", "h5py", "netcdf4", "opencv-python-headless", "pyogrio", "pyproj", "rasterio", "shapely"]

[tool.pixi.pypi-dependencies]
    geoparquet-lod = { git = "https://github.com/Shane98c/geoparquet-lod.git", rev = "5f4556a6d581ad850f247893652484fb713f7dfe" }
    ocr            = { path = ".", editable = true }

[tool.pixi.environments]
    # Map environments to features
    all-deps = ["coiled-deploy", "data-mgmt", "dev", "docs", "fire", "flood"]
    default  = ["coiled-deploy", "data-mgmt", "dev", "fire", "flood"]
    deploy   = ["coiled-deploy", "fire"]
    dev      = ["coiled-deploy", "data-mgmt", "dev", "fire", "flood"]
    docs     = ["coiled-deploy", "docs", "fire"]
    flood    = ["coiled-deploy", "data-mgmt", "dev", "fire", "flood"]
    # Standalone: Coiled package sync replicates the whole environment, and the
    # default one carries packages its solver cannot resolve.
    fdp = { features = ["fdp"], no-default-feature = true }
    # fdp plus R for train_fdp.R; run `pixi run -e fdp-r fdp-r-cran` once.
    fdp-r = { features = ["fdp", "fdp-r"], no-default-feature = true }

# Tasks grouped by features
[tool.pixi.feature.dev.tasks]
    format            = { cmd = "ruff format" }
    lint              = { cmd = "prek run --all-files" }
    tests             = { cmd = "pytest -m 'not integration'" }
    tests-integration = { cmd = "pytest -m 'integration'" }

[tool.pixi.feature.docs.tasks]
    docs-build = { cmd = "sphinx-build -T -b html docs _build/html" }
    docs-serve = { cmd = "sphinx-autobuild docs _build/html" }

[tool.pixi.feature.flood.tasks]
    flood-etl   = { cmd = "python -m ocr.risks.flood.etl.flood" }  # pixi run flood-etl --version v2.0.0 [--overwrite]
    flood-all   = { cmd = "ocr run runs/flood/v2.0.0.toml" }
    flood-local = { cmd = "ocr run runs/flood/local.toml" }

[tool.pixi.feature.data-mgmt.tasks]
    jupyter = { cmd = "jupyter lab" }

# What the FDP training scripts (input-data/tensor/fdp) import, so Coiled package
# sync has a small environment to replicate.
[tool.pixi.feature.fdp.dependencies]
    coiled   = ">=1.120.0,<2"
    duckdb   = ">=1.3.2,<2"
    numpy    = ">=2,<3"
    pandas   = ">=2,<3"
    pyarrow  = ">=21.0.0,<22"
    pyproj   = ">=3.7.2,<4"
    python   = "3.13.*"
    rasterio = ">=1.4,<2"
    requests = ">=2,<3"
    s3fs     = ">=2025.9.0,<2026"
    zarr     = ">=3.2.1,<4"

# dismo, smoof, mlrMBO and tuneRanger have no osx-arm64 conda builds, so the
# fdp-r-cran task compiles them from CRAN into the environment.
[tool.pixi.feature.fdp-r]
    platforms = ["linux-64", "osx-arm64-15"]

[tool.pixi.feature.fdp-r.dependencies]
    c-compiler        = "*"
    cxx-compiler      = "*"
    fortran-compiler  = "*"
    make              = "*"
    r-base            = "4.4.*"
    r-bbmisc          = "*"
    r-checkmate       = "*"
    "r-data.table"    = "*"
    r-dicekriging     = "*"
    r-ggplot2         = "*"
    r-jsonlite        = "*"
    r-lhs             = "*"
    r-lubridate       = "*"
    r-mlr             = "*"
    r-paramhelpers    = "*"
    r-parallelmap     = "*"
    r-plotly          = "*"
    r-ranger          = "*"
    r-raster          = "*"
    r-rcolorbrewer    = "*"
    r-rcpp            = "*"
    r-rcpparmadillo   = "*"
    r-snow            = "*"
    r-sp              = "*"
    r-terra           = "*"

[tool.pixi.feature.fdp-r.tasks]
    fdp-r-cran = { cmd = "Rscript -e 'options(Ncpus = 8); need <- setdiff(c(\"dismo\", \"smoof\", \"mlrMBO\", \"tuneRanger\"), rownames(installed.packages())); if (length(need)) install.packages(need, repos = \"https://cloud.r-project.org\", type = \"source\")'" }

# Only python comes from conda-forge; all other deps live in the standard [project] / [dependency-groups] tables.
[tool.pixi.dependencies]
    python = "3.13.*"

[tool.pixi.tasks]
    regions-etl = { cmd = "python -m ocr.regions.tiger" }
    historic-mtbs = { cmd = "python -m ocr.historic.mtbs" }
    historic-ibtracs = { cmd = "python -m ocr.historic.ibtracs" }
    # Package-syncs the local env. Bigger VM: `pixi run start-coiled-notebook m8g.2xlarge`.
    start-coiled-notebook = { cmd = "coiled notebook start --sync --vm-type {{ vm }} --sync-ignore .pixi --sync-ignore .venv --tag Project=OCR", args = [{ arg = "vm", default = "m8g.xlarge" }] }
