# Full flood deploy on Coiled: `pixi run flood-all`. score mosaics the FDP refit (`ocr.risks.flood.refit`).
risk = "flood"
version = "v2.0.0"
stages = ["score", "pyramid", "buildings", "regions"]
coiled = true

[kwargs.score]  # the FDP refit model run, all 18 watersheds
run = "noaa-200612-202512"
distance = "planar"

[job.score]  # one task, which runs on the scheduler VM; JOBS.score is sized for fire's regions
vm_type = ["r8g.xlarge"]
scheduler_vm_type = ["r8g.xlarge"]
spot_policy = "on-demand"

[kwargs.pyramid]
levels = "auto"

[kwargs.buildings]
point_strategy = "ST_Centroid"
